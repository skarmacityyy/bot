version: '3.9'
services:
  bot:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
